[package]
name = "fff-workspace"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Workspace-scoped file navigation and editing primitives for coding agents"

[dependencies]
fff = { package = "fff-search", git = "https://github.com/dmtrKovalenko/fff", rev = "7353971198321b5330824c29eb4e49635c072245" }
blake3 = "1.8"
globset = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2.6"
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
