name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-analyzer
      - name: Install compiler test dependencies
        timeout-minutes: 5
        run: |
          # The runner's Azure HTTP mirror stalled in run 40370092368.
          # Keep the same signed Ubuntu packages, using the official HTTPS mirror.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=1 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=1 install -y clangd clang
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
      - run: cargo build --locked --bin ffsake
      - run: cargo build --locked --bin ffsake-mcp
      - run: python3 scripts/benchmark.py target/debug/ffsake
      - run: python3 scripts/mcp_smoke.py target/debug/ffsake-mcp
      - run: python3 scripts/directory_smoke.py target/debug/ffsake-mcp
      - run: python3 scripts/search_archive_smoke.py target/debug/ffsake-mcp
      - run: python3 scripts/layout_smoke.py target/debug/ffsake-mcp
      - run: python3 scripts/mcp_profile_smoke.py target/debug/ffsake-mcp
      - run: python3 -m unittest tests.test_worktree_rebind
      - run: python3 -m unittest tests.test_rc_benchmark
      - run: python3 scripts/worktree_mcp_smoke.py target/debug/ffsake-mcp
      - run: python3 scripts/workflow_smoke.py target/debug/ffsake-mcp
      - run: python3 scripts/git_write_smoke.py target/debug/ffsake-mcp
      - run: python3 scripts/git_remote_smoke.py target/debug/ffsake-mcp
      - run: python3 scripts/git_multi_repo_smoke.py target/debug/ffsake-mcp
      - run: python3 scripts/project_tasks_smoke.py target/debug/ffsake-mcp
      - run: python3 scripts/task_output_smoke.py target/debug/ffsake-mcp
      - run: python3 scripts/alpha_install_smoke.py
      - run: python3 -m unittest tests.test_release_install
      - run: python3 scripts/update_notice_smoke.py target/debug/ffsake-mcp
      - run: python3 scripts/debug_protocol_smoke.py target/debug/ffsake-mcp
      - run: python3 scripts/debug_attach_protocol_smoke.py target/debug/ffsake-mcp
      - run: python3 -m venv "$RUNNER_TEMP/ffsake-debugpy" && "$RUNNER_TEMP/ffsake-debugpy/bin/python" -m pip install debugpy==1.8.17
      - run: python3 scripts/debug_compat_smoke.py target/debug/ffsake-mcp --kind python --adapter "$RUNNER_TEMP/ffsake-debugpy/bin/python" --report "$RUNNER_TEMP/debugpy-report.json"
      - run: python3 scripts/debugpy_attach_probe.py target/debug/ffsake-mcp --python "$RUNNER_TEMP/ffsake-debugpy/bin/python" --report "$RUNNER_TEMP/debugpy-attach-report.json"
      - run: python3 -m unittest tests.test_install_guidance
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned MIT-licensed netcoredbg test dependency
        run: |
          curl --fail --location --retry 3 https://github.com/Samsung/netcoredbg/releases/download/3.2.0-1092/netcoredbg-linux-amd64.tar.gz -o "$RUNNER_TEMP/netcoredbg.tar.gz"
          echo "080eb3b2d2152465f599d3b33d1ee6e747794e11cc0a3773ec689f5e5f2c5afa  $RUNNER_TEMP/netcoredbg.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/ffsake-dap"
          tar -xzf "$RUNNER_TEMP/netcoredbg.tar.gz" -C "$RUNNER_TEMP/ffsake-dap"
      - run: python3 scripts/debug_smoke.py target/debug/ffsake-mcp --adapter "$RUNNER_TEMP/ffsake-dap/netcoredbg/netcoredbg"
      - run: python3 scripts/debug_attach_smoke.py target/debug/ffsake-mcp --adapter "$RUNNER_TEMP/ffsake-dap/netcoredbg/netcoredbg"
      - run: python3 scripts/repository_smoke.py target/debug/ffsake-mcp
      - run: python3 scripts/repository_lsp_smoke.py target/debug/ffsake-mcp --verify-rename
      - run: python3 scripts/rust_syntax_smoke.py target/debug/ffsake-mcp
      - run: python3 -m unittest discover -s tests -p 'test_rust_lsp_probe.py' -v
      - run: python3 scripts/rust_lsp_probe.py
      - run: python3 scripts/rust_lsp_smoke.py target/debug/ffsake-mcp
      - run: python3 scripts/semantic_smoke.py target/debug/ffsake-mcp
      - run: python3 scripts/access_smoke.py target/debug/ffsake-mcp
      - run: python3 scripts/persistent_access_smoke.py target/debug/ffsake-mcp
      - run: python3 scripts/rust_manifest_context_smoke.py target/debug/ffsake-mcp
      - run: python3 scripts/rust_lsp_config_smoke.py target/debug/ffsake-mcp
      - run: python3 scripts/rust_lsp_scope_smoke.py target/debug/ffsake-mcp
      - run: python3 scripts/rust_action_smoke.py target/debug/ffsake-mcp
      - run: python3 scripts/rust_rename_probe.py
      - run: python3 scripts/rust_rename_smoke.py target/debug/ffsake-mcp
      - run: python3 scripts/rust_rename_shorthand_smoke.py target/debug/ffsake-mcp
      - run: python3 scripts/rust_macro_context_smoke.py target/debug/ffsake-mcp
      - run: python3 -m py_compile scripts/agent_benchmark.py scripts/agent_benchmark_suite.py
      - run: python3 -m unittest discover -s tests -p 'test_agent_benchmark_suite.py' -v
