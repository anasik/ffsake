name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
      - run: cargo build --locked --bin ffsake
      - run: cargo build --locked --bin ffsake-mcp
      - run: python3 scripts/benchmark.py target/debug/ffsake
      - run: python3 scripts/mcp_smoke.py target/debug/ffsake-mcp
      - run: python3 -m py_compile scripts/agent_benchmark.py
