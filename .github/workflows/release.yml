name: Alpha release
on:
  push:
    tags: ['v*-alpha.*']
  workflow_dispatch:
    inputs:
      version:
        description: Alpha version for package test (does not publish)
        required: true
        default: v0.1.0-alpha.1
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful CI on the tagged commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          count=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=1" --jq '.total_count // 0')
          if [ "$count" -lt 1 ]; then
            echo "::error::No successful CI run exists for $SHA; refusing to package or publish."
            exit 1
          fi
          echo "Verified successful CI for $SHA"
  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x86_64
          - runner: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and verify archive
        env:
          FFSAKE_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          cargo build --locked --release --bins
          if [ "$(uname -s)" = Darwin ]; then otool -L target/release/ffsake-mcp; else ldd target/release/ffsake-mcp; fi
          python3 scripts/release_package.py --version "$FFSAKE_RELEASE_VERSION" --binary-dir target/release --output dist
      - name: Verify clean installation from the packaged archive
        env:
          FFSAKE_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          python3 scripts/alpha_release_smoke.py \
            --archive "$(python3 -c "import glob;print(glob.glob('dist/*.tar.gz')[0])")" \
            --version "$FFSAKE_RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*.tar.gz
  checksums:
    needs: package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [verify, checksums]
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Re-check CI before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          count=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=1" --jq '.total_count // 0')
          if [ "$count" -lt 1 ]; then
            echo "::error::No successful CI run exists for $SHA; refusing to publish."
            exit 1
          fi
          test -f dist/SHA256SUMS
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq 2
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/$TAG.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" dist/* --prerelease --title "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" dist/* --prerelease --title "$TAG" --notes 'Alpha binaries with system runtime libraries. See INSTALL.md for installation, checksums, updates and reconnection.'
          fi
